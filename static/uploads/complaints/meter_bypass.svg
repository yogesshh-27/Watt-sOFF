<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#12131C" rx="16"/>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181926"/>
      <stop offset="100%" stop-color="#101018"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="580" height="380" fill="url(#cardGrad)" rx="12" stroke="#2A2B3D" stroke-width="2"/>
  <!-- Smart Meter Casing -->
  <rect x="120" y="60" width="360" height="280" rx="16" fill="#1F202F" stroke="#3D4058" stroke-width="3"/>
  <!-- LCD Display -->
  <rect x="180" y="90" width="240" height="70" rx="8" fill="#0D1B14" stroke="#00E599" stroke-width="1.5"/>
  <text x="210" y="135" fill="#00E599" font-family="monospace" font-size="26" font-weight="bold">0003.1 kWh</text>
  <text x="360" y="115" fill="#F59E0B" font-family="sans-serif" font-size="10">SLOW READ</text>
  <!-- Jumper wire bypassing terminals -->
  <rect x="170" y="260" width="260" height="60" rx="6" fill="#141520" stroke="#FF2D55" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="210" cy="290" r="8" fill="#D97706"/>
  <circle cx="270" cy="290" r="8" fill="#D97706"/>
  <circle cx="330" cy="290" r="8" fill="#D97706"/>
  <circle cx="390" cy="290" r="8" fill="#D97706"/>
  <!-- Illegal bypass shunt -->
  <path d="M210 290 C 210 345, 390 345, 390 290" fill="none" stroke="#FF2D55" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="330" r="14" fill="#FF2D55"/>
  <text x="296" y="335" fill="#FFF" font-family="sans-serif" font-size="14" font-weight="bold">!</text>
  <!-- Neodymium Magnet on Meter -->
  <rect x="370" y="170" width="55" height="35" rx="4" fill="#6366F1" stroke="#FFF" stroke-width="1.5"/>
  <text x="376" y="192" fill="#FFF" font-family="sans-serif" font-size="9" font-weight="bold">MAGNET</text>
  <text x="145" y="200" fill="#FFF" font-family="sans-serif" font-size="13" font-weight="bold">Smart Meter ID: M009</text>
  <text x="145" y="220" fill="#FF2D55" font-family="sans-serif" font-size="12">Shunt Bypass: -69.5% Under-read</text>
  <!-- Evidence tag -->
  <rect x="24" y="24" width="220" height="36" fill="rgba(0,0,0,0.6)" rx="8" stroke="#FF2D55" stroke-width="1"/>
  <circle cx="40" cy="42" r="5" fill="#FF2D55"/>
  <text x="54" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">CITIZEN EVIDENCE #7731</text>
</svg>
