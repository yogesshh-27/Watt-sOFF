  </defs>
  <rect x="10" y="10" width="580" height="380" fill="url(#bg3)" rx="12" stroke="#2A2B3D" stroke-width="2"/>
  <!-- Terminal Box with Broken Lead Seal -->
  <rect x="140" y="70" width="320" height="260" rx="12" fill="#1B1C2A" stroke="#4B4E68" stroke-width="2"/>
