  <path d="M240 180 L 290 200" fill="none" stroke="#A1A1AA" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 210 L 370 190" fill="none" stroke="#A1A1AA" stroke-width="4" stroke-linecap="round" stroke-dasharray="5,3"/>
  <circle cx="305" cy="205" r="16" fill="#FF2D55" stroke="#FFF" stroke-width="2"/>
  <text x="299" y="211" fill="#FFF" font-family="sans-serif" font-size="16" font-weight="bold">X</text>
