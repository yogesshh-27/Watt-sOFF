  <rect x="24" y="24" width="220" height="36" fill="rgba(0,0,0,0.6)" rx="8" stroke="#00E599" stroke-width="1"/>
  <circle cx="40" cy="42" r="5" fill="#00E599"/>
  <text x="54" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">CITIZEN EVIDENCE #6105</text>
